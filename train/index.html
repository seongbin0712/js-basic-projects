<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One IT Academy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</head>
<body>
  
  <!-- NAV -->
  <nav>
    <div class="navigation">
      <ul>
        <i id="menu-close" class="fas fa-times"></i>
        <li><a href="index.html">home</a></li>
        <li><a href="search.html">search</a></li>
      </ul>
      <img src="./images/menu.png" alt="menu-btn" id="menu-btn">
    </div>
  </nav>

  <section class="home">
    <div class="container">
      <div class="header-selection">
        <div class="input-container">
          <label class="label">날짜</label>
          <input type="date" class="input day">
        </div>
  
        <div class="input-container">
          <label class="label">기차 종류</label>
          <select id="train-selector" class="select traintype">
            <option value="" disabled selected hidden>선택</option>
            <option value="KTX">KTX</option>
            <option value="SRT">SRT</option>
          </select>
        </div>
      </div>

      <div class="station">
        <div class="input-container">
          <label class="label">출발역</label>
          <select class="select" id="start">
            <option value="" disabled selected hidden>선택</option>
            <option value="부산역">부산역</option>
            <option value="서울역">서울역</option>
            <option value="대전역">대전역</option>
          </select>
        </div>
        <span class="material-symbols-outlined" style="color: black;">
          arrow_circle_right
        </span>
        <div class="input-container">
          <label class="label">도착역</label>
          <select class="select" id="end">
            <option value="" disabled selected hidden>선택</option>
            <option value="부산역">부산역</option>
            <option value="서울역">서울역</option>
            <option value="대전역">대전역</option>
          </select>
        </div>
      </div>

      <div class="arrival-time">
        <div class="input-container">
          <label class="label">출발시간</label>
          <input type="time" class="input time1">
        </div>
        <span class="material-symbols-outlined" style="color: black;">
          arrow_circle_right
        </span>
        <div class="input-container">
          <label class="label">도착시간</label>
          <input type="time" class="input time2">
        </div>
      </div>

      <div class="info">
        <div>
          <label class="label">호차번호</label>
          <input type="text" class="input trainNumber">
        </div>
        <div>
          <label class="label">좌석번호</label>
          <input type="text" class="input seatNumber">
        </div>
        <div>
          <label class="label">금액</label>
          <input type="text" class="input price">
        </div>
      </div>

      <form>
        <div class="btn-container">
          <button type="submit" class="btn form">입력</button>
          <button type="reset" class="btn reset">초기화</button>
        </div>
      </form>
    </div>
  </section>

  <script>
    $("#menu-btn").click(function() {
      $("nav .navigation ul").addClass("active")
    })
    $("#menu-close").click(function() {
      $("nav .navigation ul").removeClass("active")
    })
  </script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
